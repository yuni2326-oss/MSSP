[project]
name = "equipment_analysis"
version = "0.2.0"
description = "KITECH equipment vibration analysis (pump/motor 일반화)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7",
    "scikit-learn>=1.3", "joblib>=1.3", "pyyaml>=6.0", "openpyxl>=3.1",
]
[project.optional-dependencies]
dev = ["pytest>=7.0"]
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["equipment_analysis", "equipment_analysis.tests"]

[tool.setuptools.package-dir]
"equipment_analysis" = "."
